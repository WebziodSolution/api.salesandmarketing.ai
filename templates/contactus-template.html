<table cellpadding=0 cellspacing=0 bgcolor='#ffffff' valign='top' width=100% border=1 bordercolor='#000000'>
    <tr>
        <td width='200' bgcolor='#cccccc'>
            &nbsp;<b>Your Name:</b>
        </td>
        <td width='500'>
            &nbsp; {{ userName }}
        </td>
    </tr>
    <tr>
        <td width='200' bgcolor='#cccccc'>
            &nbsp;<b>Email:</b>
        </td>
        <td width='500'>
            &nbsp; {{ email }}
        </td>
    </tr>
    <tr>
        <td width='200' bgcolor='#cccccc'>
            &nbsp;<b>Service:</b>
        </td>
        <td>
            &nbsp; {{ services }}
        </td>
    </tr>
    <tr>
        <td width='200' bgcolor='#cccccc'>
            &nbsp;<b>Message:</b>
        </td>
        <td>
            &nbsp; {{ message|linebreaksbr }}
        </td>
    </tr>
</table>
